<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MEU MANGUE</title>

    <link rel="stylesheet" href="./../css/estilo.css">
    <link rel="stylesheet" href="./../css/dashboards.css">
    <link rel="icon" href="./../assets/caranguejo_sem_moldura.png">
    <link rel="preconnect" href="https://fonts.gstatic.com">

    <script src="../js/sessao.js"></script>
</head>

<body onload="montarNavbar('dashboard'); validarSessao(); carregarPerfil()">

    <div class="header">
      <div class="container">
        <h1 class="titulo"><img class="logo-titulo" src="../assets/caranguejo.svg" alt="logo caranguejo">MEU <span class="recorte">MANGUE</span></h1>
        <ul class="navbar" id="navbar"></ul>
      </div>
    </div>

    <div class="faixa_divisoria"></div>

    <div class="dash_pagina">
        <div class="container">
            <div class="dash_grid">
                <div class="dash_sidebar">
                    <a href="dashboard.html">Visão geral</a>
                    <a href="minhas-historias.html">Minhas histórias</a>
                    <a class="ativo" href="meu-perfil.html">Meu perfil</a>
                    <div class="dash_sair" onclick="limparSessao()">Sair</div>
                </div>

                <div class="dash_conteudo">
                    <h2 class="dash_titulo">Meu perfil</h2>

                    <div class="dash_form">
                        <div class="dash_campo">
                            <span>Nome</span>
                            <input id="nome_input" type="text">
                        </div>
                        <div class="dash_campo">
                            <span>E-mail</span>
                            <input id="email_input" type="text">
                        </div>
                        <div class="dash_campo">
                            <span>Nova senha</span>
                            <input id="senha_input" type="password" placeholder="Deixe em branco pra manter a atual">
                        </div>
                        <button class="dash_botao_salvar" onclick="salvarPerfil()">Salvar alterações</button>

                        <div class="dash_zona_perigo">
                            <button class="dash_apagar_conta" onclick="apagarConta()">Apagar minha conta</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

</body>

</html>

<script>

    function carregarPerfil() {
        nome_input.value = sessionStorage.NOME_USUARIO;
        email_input.value = sessionStorage.EMAIL_USUARIO;
    }

    function salvarPerfil() {
        var perfil = {
            nomeServer: nome_input.value,
            emailServer: email_input.value,
            // Campo em branco significa "manter a senha atual" — o back-end trata isso.
            senhaServer: senha_input.value
        };

        if (perfil.nomeServer == "" || perfil.emailServer == "") {
            alert("Preencha nome e e-mail.");
            return false;
        }

        fetch("/usuarios/atualizar/" + sessionStorage.ID_USUARIO, {
            method: "PUT",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(perfil)
        }).then(function (resposta) {
            if (resposta.ok) {
                // A sessão guarda nome e e-mail, então precisa acompanhar a mudança.
                sessionStorage.NOME_USUARIO = perfil.nomeServer;
                sessionStorage.EMAIL_USUARIO = perfil.emailServer;
                senha_input.value = "";

                montarNavbar('dashboard');
                validarSessao();

                alert("Perfil atualizado!");
            } else {
                resposta.text().then(function (texto) {
                    alert(texto);
                });
            }
        }).catch(function (erro) {
            console.log(erro);
        })

        return false;
    }

    function apagarConta() {
        if (!confirm("Isso apaga sua conta e TODAS as suas histórias. Não dá para desfazer. Tem certeza?")) {
            return;
        }

        fetch("/usuarios/apagar/" + sessionStorage.ID_USUARIO, {
            method: "DELETE"
        }).then(function (resposta) {
            if (resposta.ok) {
                alert("Sua conta foi apagada.");
                limparSessao();
            } else {
                resposta.text().then(function (texto) {
                    alert(texto);
                });
            }
        }).catch(function (erro) {
            console.log(erro);
        })
    }

</script>
