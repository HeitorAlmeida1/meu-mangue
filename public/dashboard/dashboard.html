<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MEU MANGUE</title>

    <link rel="stylesheet" href="./../css/estilo.css">
    <link rel="stylesheet" href="./../css/dashboards.css">
    <link rel="icon" href="./../assets/caranguejo_sem_moldura.png">
    <link rel="preconnect" href="https://fonts.gstatic.com">

    <script src="../js/sessao.js"></script>
</head>

<body onload="validarSessao()">

    <div class="header">
      <div class="container">
        <h1 class="titulo"><img class="logo-titulo" src="../assets/caranguejo.svg" alt="logo caranguejo">MEU <span class="recorte">MANGUE</span></h1>
        <ul class="navbar">
          <li>
            <a href="../index.html">Home</a>
          </li>
          <li>
            <a href="../historias.html">Histórias</a>
          </li>
          <li class="agora">
            <a href="dashboard.html">Dashboard</a>
          </li>
        </ul>
      </div>
    </div>

    <div class="faixa_divisoria"></div>

    <div class="dash_pagina">
        <div class="container">
            <div class="dash_grid">
                <div class="dash_sidebar">
                    <a class="ativo" href="dashboard.html">Visão geral</a>
                    <a href="minhas-historias.html">Minhas histórias</a>
                    <a href="meu-perfil.html">Meu perfil</a>
                    <div class="dash_sair" onclick="limparSessao()">Sair</div>
                </div>

                <div class="dash_conteudo">
                    <h2 class="dash_saudacao">Fala, <span id="b_usuario">usuário</span>!</h2>

                    <div class="dash_metricas">
                        <div class="dash_metrica dash_metrica_destaque">
                            <div class="dash_metrica_label">Minhas histórias</div>
                            <div class="dash_metrica_valor" id="total_minhas">06</div>
                        </div>
                        <div class="dash_metrica">
                            <div class="dash_metrica_label">Histórias lidas</div>
                            <div class="dash_metrica_valor" id="total_lidas">14</div>
                        </div>
                        <div class="dash_metrica">
                            <div class="dash_metrica_label">Total no site</div>
                            <div class="dash_metrica_valor" id="total_site">37</div>
                        </div>
                    </div>

                    <div class="dash_destaque">
                        <div class="dash_destaque_tag">Em destaque</div>
                        <h3 class="dash_destaque_musica">CORINTHIANS</h3>
                        <div class="dash_destaque_info">CHICO &middot; por Heitor Torres</div>
                        <button onclick="window.location='../historia-detalhe.html?id=1'">Ler história</button>
                    </div>

                    <div class="dash_secao">
                        <div class="dash_cabecalho_secao">
                            <h3>Minhas histórias</h3>
                            <a class="dash_ver_todas" href="minhas-historias.html">ver todas &rarr;</a>
                        </div>
                        <div class="dash_lista" id="lista_minhas_historias">
                            <div class="dash_linha">
                                <div class="dash_linha_musica">CORINTHIANS &mdash; CHICO</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

</body>

</html>

<script>

    b_usuario.innerHTML = sessionStorage.NOME_USUARIO;

</script>
