<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MEU MANGUE</title>
    <link rel="stylesheet" href="./../css/estilo.css">
    <link rel="stylesheet" href="./../css/dashboards.css">
    <link rel="icon" href="./../assets/caranguejo_sem_moldura.png">
    <link rel="preconnect" href="https://fonts.gstatic.com">
    <script src="../js/sessao.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body onload="montarNavbar('dashboard'); validarSessao(); carregarDashboard()">
    <div class="header">
      <div class="container">
        <h1 class="titulo"><img class="logo-titulo" src="../assets/caranguejo.svg" alt="logo caranguejo">MEU <span class="recorte">MANGUE</span></h1>
        <ul class="navbar" id="navbar"></ul>
      </div>
    </div>
    <div class="faixa_divisoria"></div>

    <div class="dash_pagina">
        <div class="container">
            <div class="dash_grid">
                <div class="dash_sidebar">
                    <a class="ativo" href="dashboard.html">Visão geral</a>
                    <a href="minhas-historias.html">Minhas histórias</a>
                    <a href="meu-perfil.html">Meu perfil</a>
                    <div class="dash_sair" onclick="limparSessao()">Sair</div>
                </div>

                <div class="dash_conteudo">
                    <h2 class="dash_saudacao">Fala, <span id="b_usuario">usuário</span>!</h2>

                    <div class="dash_metricas">
                        <div class="dash_metrica dash_metrica_destaque">
                            <div class="dash_metrica_label">Minhas histórias</div>
                            <div class="dash_metrica_valor" id="total_minhas">0</div>
                        </div>
                        <div class="dash_metrica">
                            <div class="dash_metrica_label">Impacto médio</div>
                            <div class="dash_metrica_valor" id="impacto_medio">0</div>
                        </div>
                        <div class="dash_metrica">
                            <div class="dash_metrica_label">Total no site</div>
                            <div class="dash_metrica_valor" id="total_site">0</div>
                        </div>
                    </div>

                    <div class="dash_destaque" id="dash_destaque">
                        <div class="dash_destaque_tag">Em destaque &middot; maior impacto</div>
                        <h3 class="dash_destaque_musica" id="destaque_musica">—</h3>
                        <div class="dash_destaque_info" id="destaque_info"></div>
                        <button id="destaque_botao">Ler história</button>
                    </div>

                    <div class="dash_graficos">
                        <div class="dash_grafico">
                            <h4>Histórias por fase da vida</h4>
                            <canvas id="grafico_fases"></canvas>
                        </div>
                        <div class="dash_grafico">
                            <h4>Impacto médio por fase</h4>
                            <canvas id="grafico_impacto"></canvas>
                        </div>  
                    </div>

                    <div class="dash_secao">
                        <div class="dash_cabecalho_secao">
                            <h3>Minhas histórias</h3>
                            <a class="dash_ver_todas" href="minhas-historias.html">ver todas &rarr;</a>
                        </div>
                        <div class="dash_lista" id="lista_minhas_historias"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
<script>
    var CORES = ["#E2582A", "#F2B705", "#2E6B3F", "#3B2A1E", "#D9381E", "#6B5F50"];
    function carregarDashboard() {
        fetch("/historias/dadosDashboard/" + sessionStorage.ID_USUARIO).then(function (resposta) {
            if (resposta.ok) {
                resposta.json().then(function (dados) {
                    preencherMetricas(dados);
                    preencherDestaque(dados.destaque);
                    desenharGraficos(dados);
                });
            } else {
                resposta.text().then(function (texto) {
                    alert(texto);
                });
            }
        }).catch(function (erro) {
            console.log(erro);
        })
        listarMinhasHistorias();
    }
    function preencherMetricas(dados) {
        total_minhas.innerHTML = dados.totalMinhas;
        total_site.innerHTML = dados.totalSite;
        impacto_medio.innerHTML = dados.impactoMedio == null ? "—" : dados.impactoMedio;
    }
    function preencherDestaque(destaque) {
        if (destaque == undefined) {
            dash_destaque.style.display = "none";
            return;
        }

        destaque_musica.innerHTML = destaque.nome_musica;
        destaque_info.innerHTML = destaque.artista + " &middot; impacto " + destaque.impacto + "/5";
        destaque_botao.onclick = function () {
            window.location = "../historia-detalhe.html?id=" + destaque.id;
        };
    }
    function listarMinhasHistorias() {
        fetch("/historias/listarPorUsuario/" + sessionStorage.ID_USUARIO).then(function (resposta) {
            if (resposta.ok) {
                resposta.json().then(function (json) {
                    if (json.length == 0) {
                        lista_minhas_historias.innerHTML = `<div class="dash_linha">
                                                                <div class="dash_linha_musica">Você ainda não publicou nenhuma história.</div>
                                                            </div>`;
                        return;
                    }
                    var htmlLinhas = "";
                    for (var i = 0; i < json.length && i < 5; i++) {
                        htmlLinhas += `<div class="dash_linha">
                                        <div class="dash_linha_musica">${json[i].nome_musica} &mdash; ${json[i].artista}</div>
                                       </div>`;
                    }
                    lista_minhas_historias.innerHTML = htmlLinhas;
                });
            }
        }).catch(function (erro) {
            console.log(erro);
        })
    }
    function desenharGraficos(dados) {
        desenharFases(dados.porFase);
        desenharImpacto(dados.impactoPorFase);
        desenharGeneroPorFase(dados.porGeneroEFase);
        desenharDecadas(dados.porDecada);
    }
    function separarEmColunas(lista, campoRotulo, campoValor) {
        var rotulos = [];
        var valores = [];
        for (var i = 0; i < lista.length; i++) {
            rotulos.push(lista[i][campoRotulo]);
            valores.push(lista[i][campoValor]);
        }
        return { rotulos: rotulos, valores: valores };
    }
    function desenharFases(porFase) {
        var dados = separarEmColunas(porFase, "fase", "total");
        new Chart(grafico_fases, {
            type: "doughnut",
            data: {
                labels: dados.rotulos,
                datasets: [{
                    data: dados.valores,
                    backgroundColor: CORES
                }]
            },
            options: {
                plugins: {
                    legend: { position: "bottom" }
                }
            }
        });
    }
    function desenharImpacto(impactoPorFase) {
        var dados = separarEmColunas(impactoPorFase, "fase", "media");
        new Chart(grafico_impacto, {
            type: "bar",
            data: {
                labels: dados.rotulos,
                datasets: [{
                    label: "Impacto médio",
                    data: dados.valores,
                    backgroundColor: CORES[0]
                }]
            },
            options: {
                plugins: { legend: { display: false } },
                scales: {
                    y: { beginAtZero: true, max: 5 }
                }
            }
        });
    }
</script>
