<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MEU MANGUE</title>

    <link rel="stylesheet" href="./../css/estilo.css">
    <link rel="stylesheet" href="./../css/dashboards.css">
    <link rel="icon" href="./../assets/caranguejo_sem_moldura.png">
    <link rel="preconnect" href="https://fonts.gstatic.com">

    <script src="../js/sessao.js"></script>
</head>

<body onload="montarNavbar('dashboard'); validarSessao(); listarMinhasHistorias()">

    <div class="header">
      <div class="container">
        <h1 class="titulo"><img class="logo-titulo" src="../assets/caranguejo.svg" alt="logo caranguejo">MEU <span class="recorte">MANGUE</span></h1>
        <ul class="navbar" id="navbar"></ul>
      </div>
    </div>

    <div class="faixa_divisoria"></div>

    <div class="dash_pagina">
        <div class="container">
            <div class="dash_grid">
                <div class="dash_sidebar">
                    <a href="dashboard.html">Visão geral</a>
                    <a class="ativo" href="minhas-historias.html">Minhas histórias</a>
                    <a href="meu-perfil.html">Meu perfil</a>
                    <div class="dash_sair" onclick="limparSessao()">Sair</div>
                </div>

                <div class="dash_conteudo">
                    <div class="dash_cabecalho_secao">
                        <h2 class="dash_titulo">Minhas histórias</h2>
                        <button class="dash_botao_novo" onclick="window.location='../nova-historia.html'">+ Nova história</button>
                    </div>

                    <div class="dash_lista" id="lista_historias"></div>
                </div>
            </div>
        </div>
    </div>

</body>

</html>

<script>

    function listarMinhasHistorias() {
        fetch("/historias/listarPorUsuario/" + sessionStorage.ID_USUARIO).then(function (resposta) {
            if (resposta.ok) {
                resposta.json().then(function (json) {

                    if (json.length == 0) {
                        lista_historias.innerHTML = `<div class="dash_linha">
                                                        <div class="dash_linha_musica">Você ainda não publicou nenhuma história.</div>
                                                     </div>`;
                        return;
                    }

                    var htmlLinhas = "";

                    for (var i = 0; i < json.length; i++) {
                        var historia = json[i];

                        htmlLinhas += `<div class="dash_linha">
                                        <div class="dash_linha_musica">${historia.nome_musica} &mdash; ${historia.artista}</div>
                                        <div class="dash_linha_acoes">
                                            <button onclick="editar(${historia.id})">Editar</button>
                                            <button class="dash_apagar" onclick="apagar(${historia.id})">Apagar</button>
                                        </div>
                                       </div>`;
                    }

                    lista_historias.innerHTML = htmlLinhas;
                });
            } else {
                resposta.text().then(function (texto) {
                    alert(texto);
                });
            }
        }).catch(function (erro) {
            console.log(erro);
        })
    }

    function editar(idHistoria) {
        sessionStorage.ID_HISTORIA_EDITANDO = idHistoria;
        window.location = "../nova-historia.html";
    }

    function apagar(idHistoria) {
        if (!confirm("Tem certeza que quer apagar esta história? Não dá para desfazer.")) {
            return;
        }

        fetch("/historias/apagar/" + idHistoria, {
            method: "DELETE"
        }).then(function (resposta) {
            if (resposta.ok) {
                // Recarrega a lista para a linha apagada sumir da tela.
                listarMinhasHistorias();
            } else {
                resposta.text().then(function (texto) {
                    alert(texto);
                });
            }
        }).catch(function (erro) {
            console.log(erro);
        })
    }

</script>
