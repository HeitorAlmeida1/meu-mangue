<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MEU MANGUE</title>

    <link rel="stylesheet" href="./../css/estilo.css">
    <link rel="stylesheet" href="./../css/dashboards.css">
    <link rel="icon" href="./../assets/caranguejo_sem_moldura.png">
    <link rel="preconnect" href="https://fonts.gstatic.com">

    <script src="../js/sessao.js"></script>
</head>

<body onload="validarSessao()">

    <div class="header">
      <div class="container">
        <h1 class="titulo"><img class="logo-titulo" src="../assets/caranguejo.svg" alt="logo caranguejo">MEU <span class="recorte">MANGUE</span></h1>
        <ul class="navbar">
          <li>
            <a href="../index.html">Home</a>
          </li>
          <li>
            <a href="../historias.html">Histórias</a>
          </li>
          <li class="agora">
            <a href="dashboard.html">Dashboard</a>
          </li>
        </ul>
      </div>
    </div>

    <div class="faixa_divisoria"></div>

    <div class="dash_pagina">
        <div class="container">
            <div class="dash_grid">
                <div class="dash_sidebar">
                    <a href="dashboard.html">Visão geral</a>
                    <a class="ativo" href="minhas-historias.html">Minhas histórias</a>
                    <a href="meu-perfil.html">Meu perfil</a>
                    <div class="dash_sair" onclick="limparSessao()">Sair</div>
                </div>

                <div class="dash_conteudo">
                    <div class="dash_cabecalho_secao">
                        <h2 class="dash_titulo">Minhas histórias</h2>
                        <button class="dash_botao_novo" onclick="window.location='../nova-historia.html'">+ Nova história</button>
                    </div>

                    <div class="dash_lista" id="lista_historias">
                        <div class="dash_linha">
                            <div class="dash_linha_musica">CORINTHIANS &mdash; CHICO</div>
                            <div class="dash_linha_acoes">
                                <button onclick="editar(1)">Editar</button>
                                <button class="dash_apagar" onclick="apagar(1)">Apagar</button>
                            </div>
                        </div>

                        <div class="dash_linha">
                            <div class="dash_linha_musica">CORINTHIANS &mdash; CHICO</div>
                            <div class="dash_linha_acoes">
                                <button onclick="editar(2)">Editar</button>
                                <button class="dash_apagar" onclick="apagar(2)">Apagar</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

</body>

</html>

<script>

    b_usuario_nome = sessionStorage.NOME_USUARIO;

    function editar(idHistoria) {
        sessionStorage.ID_HISTORIA_EDITANDO = idHistoria;
        window.location = "../nova-historia.html";
    }

    function apagar(idHistoria) {
        console.log("Apagar história de id:", idHistoria);
    }

</script>
