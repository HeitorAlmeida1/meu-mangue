<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MEU MANGUE 🦀</title>

    <script src="./js/sessao.js"></script>

    <link rel="stylesheet" href="./css/estilo.css">
    <link rel="icon" href="./assets/caranguejo_transparente.png">
    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Special+Elite&display=swap" rel="stylesheet">
</head>

<body>

    <div class="header">
      <div class="container">
        <h1 class="titulo"><img class="logo-titulo" src="assets/caranguejo_transparente.png" alt="logo_caranguejo">MEU <span class="recorte"><span>M</span><span>A</span><span>N</span><span>G</span><span>U</span><span>E</span></span></h1>
        <ul class="navbar">
          <li>
            <a href="index.html">Home</a>
          </li>
          <li class="agora">
            <a href="historias.html">Histórias</a>
          </li>
          <li>
            <a href="login.html">Login</a>
          </li>
          <li>
            <a href="cadastro.html">Cadastro</a>
          </li>
        </ul>
      </div>
    </div>

    <div class="faixa_divisoria"></div>

    <div class="pagina_formulario">
        <div class="container">
            <div class="card_formulario">
                <h2 id="titulo_formulario">Nova história</h2>

                <div class="campo">
                    <span>Nome da música</span>
                    <input id="nome_musica_input" type="text" placeholder="Nome da música">
                </div>

                <div class="campo">
                    <span>Artista</span>
                    <input id="artista_input" type="text" placeholder="Nome do artista">
                </div>

                <div class="campo">
                    <span>Data da música</span>
                    <input id="data_musica_input" type="date">
                </div>

                <div class="campo">
                    <span>Fase da vida</span>
                    <select id="fase_vida_input">
                        <option value="">Selecione uma fase</option>
                        <option value="1">Infância</option>
                        <option value="2">Adolescência</option>
                        <option value="3">Hoje</option>
                    </select>
                </div>

                <div class="campo">
                    <span>Trecho (resumo curto, aparece nos cards)</span>
                    <textarea id="trecho_input" maxlength="140" placeholder="Um resumo curto da história..."></textarea>
                </div>

                <div class="campo">
                    <span>Texto completo</span>
                    <textarea id="texto_completo_input" placeholder="A história completa..."></textarea>
                </div>

                <button id="botao_publicar" onclick="salvarHistoria()">Publicar</button>
            </div>
        </div>
    </div>

    <div class="footer">
        <div class="container">
            <h4>Projeto acadêmico sem fins lucrativos. 2026/2</h4>
            <p class="footer_credito">Inspirado no Manguebeat de Chico Science &amp; Nação Zumbi.</p>
        </div>
    </div>

</body>

</html>

<script>

    var idHistoriaEditando = sessionStorage.ID_HISTORIA_EDITANDO;

    if (idHistoriaEditando) {
        titulo_formulario.innerHTML = "Editar história";
        botao_publicar.innerHTML = "Salvar alterações";
    }

    function salvarHistoria() {

        var historia = {
            nomeMusicaServer: nome_musica_input.value,
            artistaServer: artista_input.value,
            dataMusicaServer: data_musica_input.value,
            fkFaseVidaServer: fase_vida_input.value,
            trechoServer: trecho_input.value,
            textoCompletoServer: texto_completo_input.value,
            fkUsuarioServer: sessionStorage.ID_USUARIO
        };

        if (historia.nomeMusicaServer == "" || historia.artistaServer == "" || historia.dataMusicaServer == "" || historia.fkFaseVidaServer == "" || historia.trechoServer == "" || historia.textoCompletoServer == "" || historia.fkUsuarioServer == "") {
            alert('Mensagem de erro para todos os campos em branco');
            return false;
        }

        fetch("/historias/salvarHistoria", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify( historia )
        }).then(function (resposta) {
            console.log("ESTOU NO THEN DO entrar()!")

            if (resposta.ok) {
                console.log(resposta);

                resposta.json().then(json => {
                    console.log(json);
                    console.log(JSON.stringify(json));
                    setTimeout(function () {
                        window.location = "./historias.html";
                    }, 1000); // apenas para exibir o loading

                });

            } else {

                console.log("Houve um erro ao tentar cadastrar esta história");

                resposta.text().then(texto => {
                    alert(texto);
                });
            }

        }).catch(function (erro) {
            console.log(erro);
        })

        return false;
    }
</script>
